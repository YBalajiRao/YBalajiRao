<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="320" viewBox="0 0 1280 320" role="img" aria-labelledby="title desc">
  <title id="title">Yadhav Balaji Rao</title>
  <desc id="desc">AI Researcher, Data Scientist and Full-Stack Engineer. Turning research into real-world impact.</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#0B0F19"/>
      <stop offset="1" stop-color="#121A2B"/>
    </linearGradient>
    <radialGradient id="glowV" cx="0.1" cy="0.05" r="0.55">
      <stop offset="0" stop-color="#7C5CFF" stop-opacity="0.38"/>
      <stop offset="1" stop-color="#7C5CFF" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="glowC" cx="0.88" cy="0.95" r="0.5">
      <stop offset="0" stop-color="#00C7FF" stop-opacity="0.26"/>
      <stop offset="1" stop-color="#00C7FF" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="brand" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#7C5CFF"/>
      <stop offset="1" stop-color="#00C7FF"/>
    </linearGradient>
    <linearGradient id="sigGrad" gradientUnits="userSpaceOnUse" x1="850" y1="0" x2="1180" y2="0">
      <stop offset="0" stop-color="#A08BFF"/>
      <stop offset="1" stop-color="#5CE1FF"/>
    </linearGradient>
    <pattern id="grid" width="32" height="32" patternUnits="userSpaceOnUse">
      <path d="M32 0H0V32" fill="none" stroke="#FFFFFF" stroke-opacity="0.035"/>
    </pattern>
    <clipPath id="card"><rect width="1280" height="320" rx="20"/></clipPath>
  </defs>
  <style>
    .edges line { stroke:#C9D1D9; stroke-opacity:.1; stroke-width:1 }
    .sig  { fill:none; stroke:url(#sigGrad); stroke-width:2.4; stroke-linecap:round; stroke-linejoin:round;
             stroke-dasharray:6 100; stroke-dashoffset:106; animation:flow 3.6s linear infinite }
    .node { fill:#0D1117; stroke-width:2 }
    .halo { opacity:.12; animation:pulse 3.6s ease-in-out infinite }
    .eyebrow { font:600 14px ui-monospace,SFMono-Regular,Menlo,Consolas,'Liberation Mono',monospace; letter-spacing:3px; fill:url(#brand) }
    .name { font:700 64px 'Segoe UI',-apple-system,BlinkMacSystemFont,'Helvetica Neue',Arial,sans-serif; letter-spacing:-1px; fill:#F0F6FC }
    .role { font:500 23px 'Segoe UI',-apple-system,BlinkMacSystemFont,'Helvetica Neue',Arial,sans-serif; fill:#C9D1D9 }
    .role .dot { fill:#7C5CFF }
    .mono { font:400 16px ui-monospace,SFMono-Regular,Menlo,Consolas,'Liberation Mono',monospace; fill:#7EE0FF }
    .cursor { animation:blink 1.1s steps(1) infinite }
    @keyframes flow  { to { stroke-dashoffset:0 } }
    @keyframes pulse { 0%,100% { opacity:.08 } 50% { opacity:.42 } }
    @keyframes blink { 50% { opacity:0 } }
    @media (prefers-reduced-motion: reduce) { * { animation:none !important } }
  </style>

