      <line x1="1070" y1="260" x2="1180" y2="190"/>
    </g>
    <polyline class="sig" points="850,100 960,110 1070,160 1180,130" pathLength="100" style="animation-delay:-0.0s"/>
    <polyline class="sig" points="850,160 960,210 1070,110 1180,190" pathLength="100" style="animation-delay:-0.6s"/>
