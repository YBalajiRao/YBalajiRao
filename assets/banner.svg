      <line x1="960" y1="210" x2="1070" y2="110"/>
      <line x1="960" y1="210" x2="1070" y2="160"/>
      <line x1="960" y1="210" x2="1070" y2="210"/>
      <line x1="960" y1="210" x2="1070" y2="260"/>
      <line x1="960" y1="260" x2="1070" y2="60"/>
