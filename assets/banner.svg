  <rect x="0.75" y="0.75" width="1278.5" height="318.5" rx="19.25" fill="none" stroke="url(#brand)" stroke-opacity="0.5" stroke-width="1.5"/>

  <text x="72" y="104" class="eyebrow">// RESEARCH  ·  TEACH  ·  BUILD</text>
  <text x="70" y="172" class="name">Yadhav Balaji Rao</text>
  <rect x="72" y="194" width="112" height="4" rx="2" fill="url(#brand)"/>
  <text x="72" y="238" class="role">AI Researcher <tspan class="dot">·</tspan> Data Scientist <tspan class="dot">·</tspan> Full-Stack Engineer</text>
  <text x="72" y="274" class="mono">&gt; turning research into real-world impact<tspan class="cursor">_</tspan></text>
